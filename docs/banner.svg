<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e04a"/>
      <stop offset="1" stop-color="#d9b92a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#262626"/>

  <!-- logo mark: stylised "N" from blocks -->
  <g transform="translate(96 92)">
    <rect width="136" height="136" rx="22" fill="#141414" stroke="#2a2a2a"/>
    <rect x="30" y="30" width="18" height="76" rx="3" fill="#e8e8e8"/>
    <rect x="88" y="30" width="18" height="76" rx="3" fill="#e8e8e8"/>
    <path d="M48 30 L66 30 L88 82 L88 106 L70 106 L48 54 Z" fill="url(#accent)"/>
  </g>

  <text x="280" y="160" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#f2f2f2" letter-spacing="2">NOVA AFK</text>
  <rect x="284" y="180" width="96" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="282" y="226" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#9a9a9a">Автономный AFK-фарм для Fortnite · распознавание экрана · Rust</text>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#d0d0d0">
    <rect x="282" y="250" width="148" height="34" rx="17" fill="#151515" stroke="#2c2c2c"/>
    <text x="356" y="273" text-anchor="middle">Автозапуск</text>
    <rect x="442" y="250" width="132" height="34" rx="17" fill="#151515" stroke="#2c2c2c"/>
    <text x="508" y="273" text-anchor="middle">Team Fill</text>
    <rect x="586" y="250" width="166" height="34" rx="17" fill="#151515" stroke="#2c2c2c"/>
    <text x="669" y="273" text-anchor="middle">Спящий режим</text>
    <rect x="764" y="250" width="132" height="34" rx="17" fill="#151515" stroke="#2c2c2c"/>
    <text x="830" y="273" text-anchor="middle">Анти-AFK</text>
    <rect x="908" y="250" width="186" height="34" rx="17" fill="#151515" stroke="#2c2c2c"/>
    <text x="1001" y="273" text-anchor="middle">Без инъекций</text>
  </g>

  <!-- status pill -->
  <g transform="translate(1012 70)" font-family="Consolas, Menlo, monospace" font-size="16">
    <rect width="190" height="40" rx="20" fill="#121212" stroke="#2a2a2a"/>
    <circle cx="24" cy="20" r="7" fill="#5cbe78"/>
    <text x="42" y="26" fill="#bdbdbd">AFK: работает</text>
  </g>
</svg>
