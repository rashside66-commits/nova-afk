[package]
name = "nova_afk"
version = "1.0.0"
edition = "2021"
description = "NOVA AFK - screen-recognition AFK helper for Fortnite on Windows: auto re-queue, Team Fill check, sleep-mode wake-up, anti-AFK movement"
license = "MIT"
readme = "README.md"
keywords = ["fortnite", "afk", "automation", "computer-vision", "windows"]

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
